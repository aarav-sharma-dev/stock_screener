[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-screener"
version = "0.1.0"
description = "Long-only stock screener using free Yahoo Finance / Wikipedia data"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "yfinance>=0.2.54",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "requests>=2.31.0",
  "lxml>=5.0.0",
  "tabulate>=0.9.0",
  "beautifulsoup4>=4.12.0",
  "curl_cffi>=0.6.0",
  "pdfplumber>=0.11.0",
]

[project.optional-dependencies]
schwab = [
  # Optional WebSocket streamer only (needs Python ≥3.10). REST OAuth/quotes
  # work without this extra via requests.
  "schwab-py>=1.4.0; python_version >= '3.10'",
  "websockets>=12.0; python_version >= '3.10'",
]

[project.scripts]
stock-screener = "stock_screener.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
